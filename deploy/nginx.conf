# /etc/nginx/sites-available/vsd   – replace shop.example.com with the real domain
server {
  server_name shop.example.com;
  client_max_body_size 8m;                       # photo uploads
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# then run:  sudo certbot --nginx -d shop.example.com     (adds free HTTPS)
